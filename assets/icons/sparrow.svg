<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80" fill="currentColor">
  <defs>
    <linearGradient id="sparrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>
  <!-- Sparrow Body and Wings -->
  <g class="sparrow-body-group">
    <!-- Tail Feathers -->
    <path d="M 12 55 L 2 68 L 22 58 L 10 75 L 28 58 Z" fill="url(#sparrowGrad)" opacity="0.9" />
    <!-- Main Body -->
    <path d="M 24 55 C 32 58 48 54 62 42 C 72 34 82 28 92 24 C 95 23 93 21 89 22 C 82 24 75 27 68 28 C 65 24 58 20 50 22 C 40 25 32 35 24 55 Z" fill="url(#sparrowGrad)" />
    <!-- Beak -->
    <polygon points="92,24 99,23 92,27" fill="#f59e0b" />
    <!-- Eye -->
    <circle cx="82" cy="25" r="2.2" fill="#09090b" />
    <circle cx="82.5" cy="24.5" r="0.8" fill="#ffffff" />
    <!-- Wing 1 (Back Wing) -->
    <path class="sparrow-wing-back" d="M 45 28 C 42 12 48 2 62 0 C 60 8 56 16 52 26 Z" fill="url(#sparrowGrad)" opacity="0.7" />
    <!-- Wing 2 (Front Wing) -->
    <path class="sparrow-wing-front" d="M 46 32 C 40 16 48 4 68 2 C 64 12 58 24 52 35 Z" fill="#ffffff" />
  </g>
</svg>
