<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90" fill="none">
  <defs>
    <!-- Body Core Shading Gradient -->
    <linearGradient id="birdBodyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f1f5f9" />
      <stop offset="85%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <!-- Wing Primary Feathers Gradient -->
    <linearGradient id="wingPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <!-- Golden Highlight Glow -->
    <linearGradient id="goldFeatherGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.9" />
    </linearGradient>

    <!-- Shadow Depth -->
    <filter id="avianDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g class="avian-forward-carrier" filter="url(#avianDropShadow)">
    
    <!-- TAIL FEATHERS (Fanned, aerodynamic forward-flight stabilization) -->
    <g class="avian-tail-feathers">
      <!-- Center Tail Feather -->
      <path d="M 57 58 L 60 84 L 63 58 Z" fill="#94a3b8" opacity="0.85" />
      <path d="M 60 58 L 60 85" stroke="#d4af37" stroke-width="0.8" opacity="0.6" />
      <!-- Left Tail Feathers -->
      <path d="M 55 58 L 52 82 L 58 60 Z" fill="#cbd5e1" />
      <path d="M 52 58 L 44 78 L 56 62 Z" fill="#64748b" opacity="0.75" />
      <!-- Right Tail Feathers -->
      <path d="M 65 58 L 68 82 L 62 60 Z" fill="#cbd5e1" />
      <path d="M 68 58 L 76 78 L 64 62 Z" fill="#64748b" opacity="0.75" />
    </g>

    <!-- LEFT WING GROUP (Forward Soaring Span) -->
    <g class="avian-wing-left" id="avianWingLeft">
      <!-- Secondary / Covert Inner Feathers Layer -->
      <path d="M 52 38 C 42 36, 32 40, 22 48 C 28 44, 38 42, 48 44 Z" fill="url(#wingPrimaryGrad)" />
      
      <!-- Primary Wing Blades (Aerodynamic flight feathers) -->
      <path d="M 50 32 C 36 26, 22 24, 4 28 C 10 32, 24 33, 40 38 Z" fill="#ffffff" />
      <path d="M 48 34 C 32 29, 18 31, 2 37 C 10 40, 24 40, 42 42 Z" fill="url(#wingPrimaryGrad)" opacity="0.9" />
      <path d="M 46 36 C 30 35, 16 40, 3 47 C 12 48, 26 46, 44 45 Z" fill="#cbd5e1" opacity="0.85" />
      <path d="M 44 40 C 30 42, 20 48, 8 57 C 18 55, 30 51, 46 48 Z" fill="#94a3b8" opacity="0.8" />
      
      <!-- Golden Wing Edge Highlight -->
      <path d="M 50 32 C 34 25, 18 24, 4 28" stroke="url(#goldFeatherGlow)" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- RIGHT WING GROUP (Forward Soaring Span - Symmetrical) -->
    <g class="avian-wing-right" id="avianWingRight">
      <!-- Secondary / Covert Inner Feathers Layer -->
      <path d="M 68 38 C 78 36, 88 40, 98 48 C 92 44, 82 42, 72 44 Z" fill="url(#wingPrimaryGrad)" />
      
      <!-- Primary Wing Blades -->
      <path d="M 70 32 C 84 26, 98 24, 116 28 C 110 32, 96 33, 80 38 Z" fill="#ffffff" />
      <path d="M 72 34 C 88 29, 102 31, 118 37 C 110 40, 96 40, 78 42 Z" fill="url(#wingPrimaryGrad)" opacity="0.9" />
      <path d="M 74 36 C 90 35, 104 40, 117 47 C 108 48, 94 46, 76 45 Z" fill="#cbd5e1" opacity="0.85" />
      <path d="M 76 40 C 90 42, 100 48, 112 57 C 102 55, 90 51, 74 48 Z" fill="#94a3b8" opacity="0.8" />
      
      <!-- Golden Wing Edge Highlight -->
      <path d="M 70 32 C 86 25, 102 24, 116 28" stroke="url(#goldFeatherGlow)" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- FUSELAGE & CHEST (Streamlined Center Torso) -->
    <g class="avian-torso">
      <!-- Main Breast Shield -->
      <path d="M 54 28 C 50 34, 48 46, 52 60 C 56 66, 64 66, 68 60 C 72 46, 70 34, 66 28 C 63 24, 57 24, 54 28 Z" fill="url(#birdBodyGrad)" />
      
      <!-- Contour Feather Ribs / Plumage Detail -->
      <path d="M 54 36 Q 60 40 66 36" stroke="#d4af37" stroke-width="0.8" opacity="0.5" fill="none" />
      <path d="M 53 43 Q 60 48 67 43" stroke="#d4af37" stroke-width="0.8" opacity="0.5" fill="none" />
      <path d="M 54 51 Q 60 56 66 51" stroke="#cbd5e1" stroke-width="0.8" opacity="0.4" fill="none" />
    </g>

    <!-- HEAD & FORWARD-FACING BEAK -->
    <g class="avian-head">
      <!-- Crown & Head Structure -->
      <path d="M 54 26 C 53 18, 56 12, 60 12 C 64 12, 67 18, 66 26 C 64 28, 56 28, 54 26 Z" fill="#ffffff" />
      <path d="M 56 13 C 58 11, 62 11, 64 13 C 65 17, 64 22, 60 22 C 56 22, 55 17, 56 13 Z" fill="url(#goldFeatherGlow)" opacity="0.35" />
      
      <!-- Forward-Facing Piercing Beak (Sharp, aerodynamic point facing directly forward) -->
      <polygon points="58,16 62,16 60,6" fill="#f59e0b" />
      <polygon points="59,16 61,16 60,7" fill="#fef08a" />
      <line x1="60" y1="7" x2="60" y2="16" stroke="#b45309" stroke-width="0.6" />

      <!-- Left Eye (Piercing forward gaze) -->
      <circle cx="56.5" cy="18" r="1.4" fill="#09090b" />
      <circle cx="56.8" cy="17.7" r="0.5" fill="#fef08a" />

      <!-- Right Eye (Piercing forward gaze) -->
      <circle cx="63.5" cy="18" r="1.4" fill="#09090b" />
      <circle cx="63.2" cy="17.7" r="0.5" fill="#fef08a" />
    </g>

  </g>
</svg>
